name: Polaris Simplification Test New Action
on:
  push:
    branches: [ main, master, develop, stage, release ]
  pull_request:
    branches: [ main, master, develop, stage, release ]  
  workflow_dispatch:  
jobs:
  build:
    #runs-on: [ mac-sh-org ]
    #runs-on: [  windows-sh ]
    runs-on: [ ubuntu-latest ]
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        
      - name: Polaris Scan
        uses: blackduck-inc/black-duck-security-scan@v2.1.1
        #continue-on-error: false
        with:
        
          #bridgecli_download_url: "https://artifactory.tools.duckutil.net/artifactory/clops-local/integrations/bridge/binaries/bridge-cli-bundle/3.9.0rc1/bridge-cli-bundle-3.9.0rc1-win64.zip"
          #bridgecli_download_url: "https://artifactory.tools.duckutil.net/artifactory/clops-local/integrations/bridge/binaries/bridge-cli-bundle/3.9.0rc1/bridge-cli-bundle-3.9.0rc1-macos_arm.zip"
          bridgecli_download_version: 3.7.0
          #synopsys_bridge_download_url: https://artifactory.internal.synopsys.com/artifactory/clops-local/clops.sig.synopsys.com/synopsys-bridge/2.8.54/synopsys-bridge-2.8.54-macos_arm.zip
          #synopsys_bridge_download_url: https://artifactory.internal.synopsys.com/artifactory/clops-local/clops.sig.synopsys.com/synopsys-bridge/2.6.32/synopsys-bridge-2.6.32-win64.zip
          
          polaris_server_url: ${{ secrets.POLARIS_POC_URL }}
          polaris_access_token: ${{ secrets.POLARIS_POC_TOKEN }}
          # polaris_application_name: "Node_Goat_Source_Archive_Aug18"
          # polaris_project_name: "Node_Goat_Source_Archive_Aug18"
         
          ### Accepts Multiple Values
          polaris_assessment_types: "SAST"
          ### Uncomment below configuration if Synopsys Bridge diagnostic files needs to be uploaded
          include_diagnostics: true
          #polaris_triage: NOT_ENTITLED
          #polaris_branch_name: "github-actions"
          
          ### PULL REQUEST COMMENTS: Uncomment below to enable
          polaris_prComment_enabled: true
          #polaris_prComment_severities: "Critical,High"
          github_token: ${{ secrets.GIT_PAT_TOKEN }} # Required when PR comments is enabled
          
          ### SARIF report parameters
          #polaris_reports_sarif_create: true
          #polaris_reports_sarif_groupSCAIssues: true
          # polaris_reports_sarif_file_path: "/Users/madhusud/Github_Repos/Custom_Sarif_Path/Polaris_SAST_Critical_Only_Sarif_Report_Demo.json"
          # #polaris_reports_sarif_severities: 'Critical'
          # polaris_reports_sarif_issue_types : 'SAST,SCA'
          #polaris_upload_sarif_report: true

          

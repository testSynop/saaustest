name: CI-Polaris
on:
  push:
    branches: [ main, develop, stage ]
  pull_request:
    branches: [ polaris ]


jobs:
  build:
    runs-on: [ self-hosted ]
    timeout-minutes: 20
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Bridge Bundle - AIRGAP
        uses: blackduck-inc/black-duck-security-scan@BridgePackageManger
        with:
          ### SCANNING: Required fields
          #bridgecli_download_url: 'https://repo.blackduck.com/bds-integrations-release/com/blackduck/integration/bridge/binaries/bridge-cli-bundle/3.3.0/bridge-cli-bundle-3.3.0-macos_arm.zip'
          #'https://repo.blackduck.com/bds-integrations-release/com/blackduck/integration/bridge/binaries/bridge-cli-thin-client/3.0.87/bridge-cli-macos_arm.zip'
          bridgecli_download_version: '3.0.43'
          #bridgecli_base_url: 'https://repo.blackduck.com/bds-integrations-release/com/blackduck/integration/bridge/binaries/'
          #bridgecli_install_directory: '/Users/kirann/.blackduck/integrations'
          polaris_server_url: ${{ vars.POLARIS_SERVER_URL }}
          polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN }}
          #include_diagnostics: true
          polaris_assessment_types: "SCA"
          #polaris_reports_sarif_create: true
          network_airgap: true
          enable_bridgecli_thin_client: true
          enable_workflow_update:  true
          polaris_workflow_version: '3.0.71'
          bridgecli_registry_url: 'https://repo.blackduck.com/bds-integrations-release/com/blackduck/integration/bridge/package-manager/registries/registry.json'
          #polaris_prComment_enabled: true 
          github_token: ${{ secrets.GITHUB_TOKEN }} # Required when polaris_upload_sarif_report is set as true
